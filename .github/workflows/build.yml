name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: /tmp/stetho-gradle

    steps:
      - uses: actions/checkout@v7

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 30
        run: sdkmanager 'platforms;android-30' 'build-tools;30.0.3'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Build maintained artifacts
        run: |
          ./gradlew --no-daemon \
            :stetho:assembleRelease \
            :stetho-urlconnection:assembleRelease \
            :stetho-okhttp3:assembleRelease \
            :stetho-js-rhino:assembleRelease \
            :stetho-timber:assembleRelease

      - name: Generate local Maven artifacts
        run: |
          ./gradlew --no-daemon \
            :stetho:installArchives \
            :stetho-urlconnection:installArchives \
            :stetho-okhttp3:installArchives \
            :stetho-js-rhino:installArchives \
            :stetho-timber:installArchives

      - name: Verify Maven coordinates and dependencies
        shell: bash
        run: |
          repository="${HOME}/.m2/repository"
          version="1.6.1-rc2"
          artifacts=(
            stetho
            stetho-urlconnection
            stetho-okhttp3
            stetho-js-rhino
            stetho-timber
          )

          for artifact in "${artifacts[@]}"; do
            pom="${repository}/io/github/yearsyan/${artifact}/${version}/${artifact}-${version}.pom"
            test -f "${pom}"
            grep -q '<groupId>io.github.yearsyan</groupId>' "${pom}"
            if grep -q '<groupId>com.facebook.stetho</groupId>' "${pom}"; then
              echo "Official Stetho coordinates leaked into ${artifact}." >&2
              exit 1
            fi
          done

          legacy_okhttp="${repository}/io/github/yearsyan/stetho-okhttp/${version}"
          if [[ -e "${legacy_okhttp}" ]]; then
            echo 'The excluded OkHttp 2 artifact was generated.' >&2
            exit 1
          fi

          okhttp_pom="${repository}/io/github/yearsyan/stetho-okhttp3/${version}/stetho-okhttp3-${version}.pom"
          grep -q '<artifactId>stetho</artifactId>' "${okhttp_pom}"
