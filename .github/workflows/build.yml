name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: /tmp/stetho-gradle
      GRADLE_OPTS: -Duser.home=/tmp/stetho-home

    steps:
      - uses: actions/checkout@v7

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 30
        run: sdkmanager 'platforms;android-30' 'build-tools;30.0.3'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Build maintained artifacts
        run: ./gradlew --no-daemon :stetho:assembleRelease :stetho-okhttp3:assembleRelease

      - name: Generate local Maven artifacts
        run: ./gradlew --no-daemon :stetho:installArchives :stetho-okhttp3:installArchives

      - name: Verify Maven coordinates and dependencies
        shell: bash
        run: |
          repository="/tmp/stetho-home/.m2/repository"
          core_pom="${repository}/com/neuyan/stetho/1.6.1-neuyan.1/stetho-1.6.1-neuyan.1.pom"
          okhttp_pom="${repository}/com/neuyan/stetho-okhttp3/1.6.1-neuyan.1/stetho-okhttp3-1.6.1-neuyan.1.pom"

          test -f "${core_pom}"
          test -f "${okhttp_pom}"
          grep -q '<groupId>com.neuyan</groupId>' "${core_pom}"
          grep -q '<groupId>com.neuyan</groupId>' "${okhttp_pom}"
          grep -q '<artifactId>stetho</artifactId>' "${okhttp_pom}"
          if grep -q '<groupId>com.facebook.stetho</groupId>' "${okhttp_pom}"; then
            echo 'Official Stetho coordinates leaked into the fork POM.' >&2
            exit 1
          fi
